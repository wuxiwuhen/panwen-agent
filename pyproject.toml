[project]
name = "panwen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "akshare==1.18.84",      # pin: 字段名随版本变动
  "duckdb>=1.1.0",
  "pandas>=2.2.0",
  "sqlglot>=23.0.0",       # Plan 2 用,提前装好
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0"]
rag = ["sentence-transformers>=2.7.0"]

[tool.setuptools.packages.find]
include = ["panwen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
