# ===== join: 财务 × 指标 =====
- question: 茅台最新一期的营收和净资产收益率
  gold_sql: >
    SELECT i.report_date, i.revenue, f.roe
    FROM income_statement i
    JOIN financial_indicator f ON i.code=f.code AND i.report_date=f.report_date
    WHERE i.code='600519'
    ORDER BY i.report_date DESC LIMIT 1
  difficulty: join
  tags: [JOIN, 财务, 单股]
  answerable_on: "2026-06-30"

- question: 比亚迪最新一期营业收入和净资产
  gold_sql: >
    SELECT i.report_date, i.revenue, b.total_equity
    FROM income_statement i
    JOIN balance_sheet b ON i.code=b.code AND i.report_date=b.report_date
    WHERE i.code='002594'
    ORDER BY i.report_date DESC LIMIT 1
  difficulty: join
  tags: [JOIN, 财务, 单股]
  answerable_on: "2026-06-30"

- question: 茅台最新一期营收与经营现金流净额
  gold_sql: >
    SELECT i.report_date, i.revenue, c.op_cf
    FROM income_statement i
    JOIN cashflow_statement c ON i.code=c.code AND i.report_date=c.report_date
    WHERE i.code='600519'
    ORDER BY i.report_date DESC LIMIT 1
  difficulty: join
  tags: [JOIN, 财务, 单股]
  answerable_on: "2026-06-30"

- question: 招商银行最新一期的净利润与净资产收益率
  gold_sql: >
    SELECT i.report_date, i.net_profit, f.roe
    FROM income_statement i
    JOIN financial_indicator f ON i.code=f.code AND i.report_date=f.report_date
    WHERE i.code='600036'
    ORDER BY i.report_date DESC LIMIT 1
  difficulty: join
  tags: [JOIN, 财务, 单股]
  answerable_on: "2026-06-30"

- question: 龙虎榜最新一日上榜股票及其股票名称
  gold_sql: >
    SELECT d.code, s.name, d.net_buy
    FROM dragon_tiger d JOIN stock_basic s ON d.code=s.code
    WHERE d.date=(SELECT MAX(date) FROM dragon_tiger)
    ORDER BY d.net_buy DESC LIMIT 10
  difficulty: join
  tags: [JOIN, 龙虎榜, 资金面]
  answerable_on: "2026-06-30"

# ===== aggregate: 时序聚合 / top-k =====
- question: 茅台连续三年的 ROE 分别是多少
  gold_sql: SELECT report_date, roe FROM financial_indicator WHERE code='600519' ORDER BY report_date DESC LIMIT 3
  difficulty: aggregate
  tags: [时序, top-k, 财务]
  answerable_on: "2026-06-30"

- question: 评估股里 ROE 最高的前五只股票
  gold_sql: >
    SELECT code, MAX(roe) AS max_roe
    FROM financial_indicator
    WHERE roe IS NOT NULL
    GROUP BY code ORDER BY max_roe DESC LIMIT 5
  difficulty: aggregate
  tags: [全市场, top-k, 聚合]
  answerable_on: "2026-06-30"

- question: 茅台近三期累计净利润
  gold_sql: >
    SELECT SUM(net_profit) AS sum_net_profit
    FROM (
      SELECT net_profit FROM income_statement
      WHERE code='600519' ORDER BY report_date DESC LIMIT 3
    )
  difficulty: aggregate
  tags: [时序, 聚合, 单股]
  answerable_on: "2026-06-30"

- question: 最新一期报告期里营收最高的前十只股票
  gold_sql: >
    SELECT code, revenue
    FROM income_statement
    WHERE report_date=(SELECT MAX(report_date) FROM income_statement)
    ORDER BY revenue DESC LIMIT 10
  difficulty: aggregate
  tags: [全市场, top-k, 财务]
  answerable_on: "2026-06-30"

- question: 最近12个月CPI同比平均值
  gold_sql: >
    SELECT AVG(value) AS avg_cpi
    FROM (
      SELECT value FROM macro_series
      WHERE indicator='CPI_YOY' ORDER BY date DESC LIMIT 12
    )
  difficulty: aggregate
  tags: [宏观, 聚合, 时序]
  answerable_on: "2026-06-30"

